<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IoT-Berg" />
    <title>IoT-Berg — Software Solutions & Document APIs</title>
    <meta
      name="description"
      content="IoT-Berg provides high-performance software systems and production-grade document automation APIs: HTML-to-PDF, Markdown-to-PDF, and DOCX-to-PDF with multi-cloud failover."
    />
    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph & Social Cards -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IoT-Berg — Software Solutions & Document APIs" />
    <meta property="og:description" content="High-performance software systems, document automation APIs, and resilient cloud architectures." />
    <meta property="og:image" content="/brand/iotberg-logo-horizontal.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IoT-Berg — Software Solutions & Document APIs" />
    <meta name="twitter:description" content="High-performance software systems, document automation APIs, and resilient cloud architectures." />
    <meta name="twitter:image" content="/brand/iotberg-logo-horizontal.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      var __errStyle = 'white-space:pre-wrap;word-break:break-word;font-size:0.85rem;background:#ffffff;color:#7f1d1d;padding:1rem;border-radius:8px;border:1px solid #fecaca';
      function __paintError() {
        document.body.style.background = '#f5f7fb';
        document.body.style.color = '#b91c1c';
        document.body.style.fontFamily = 'monospace';
        document.body.style.padding = '2rem';
      }
      window.onerror = function(msg, src, line, col, err) {
        __paintError();
        document.body.innerHTML = '<h2 style="color:#b91c1c">Uncaught Error</h2><pre style="' + __errStyle + '">' + msg + '\n\nFile: ' + src + ':' + line + ':' + col + '\n\n' + (err && err.stack ? err.stack : '') + '</pre>';
        return true;
      };
      window.addEventListener('unhandledrejection', function(e) {
        __paintError();
        document.body.innerHTML = '<h2 style="color:#b91c1c">Unhandled Promise Rejection</h2><pre style="' + __errStyle + '">' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason)) + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
